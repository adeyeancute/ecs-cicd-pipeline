name: Build and Push Image

on:
 push:
   branches:
     - main

permissions:
 id-token: write
 contents: read

jobs:

 build:
   runs-on: ubuntu-latest

   steps:

     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       id: configure-aws
       with:
         role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
         aws-region: ${{ vars.AWS_REGION }}
         output-credentials: true

     - name: Login to Amazon ECR
       uses: aws-actions/amazon-ecr-login@v2
       id: login-ecr
       with:
         registries: "${{ steps.configure-aws.outputs.aws-account-id }}"

     - name: Verify ECR registry output
       run: |
         if [ -z "${{ steps.login-ecr.outputs.registry }}" ]; then
           echo "::error::ECR login did not return a registry URI. Check that the IAM role has ecr:GetAuthorizationToken and sts:GetCallerIdentity permissions."
           aws sts get-caller-identity
           exit 1
         fi
         echo "Registry: ${{ steps.login-ecr.outputs.registry }}"

     - name: Build Docker Image
       run: |
         docker build -t ${{ vars.ECR_REPOSITORY }} .

     - name: Tag Docker Image
       run: |
         docker tag ${{ vars.ECR_REPOSITORY }}:latest \
         ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest

     - name: Push Docker Image
       run: |
         docker push \
         ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
